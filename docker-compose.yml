services:
  api:
    build: .
    container_name: express-backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    container_name: postgres-db
    restart: always
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
