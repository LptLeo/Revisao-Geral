name: Validate Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (Vitest)
        run: npm run test

      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Prettier (check)
        run: npm run format:check
